apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-site
  template:
    metadata:
      labels:
        app: hello-site
    spec:
      containers:
        - name: web
          image: hello-site:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80